spring.application.name=ai-health-backend
spring.datasource.url=${DB_URL:jdbc:h2:file:./aihealth-data;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
